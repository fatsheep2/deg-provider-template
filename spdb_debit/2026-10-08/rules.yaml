options:
  title: 浦发银行借记卡配置
  operatingCurrency: CNY
template: spdb_debit
# 角色绑定：self 是这份账单自己的账户（支出时为 from，收入时为 to）；没绑的一侧由引擎补 FIXME。
accounts:
  self: Assets:DebitCard:SPB1234
# 模板规则只整理字段（对手方、摘要、币种、元数据），不写账户。
templateRules:
- id: 浦发支出
  when: <取出金额> != "" && <取出金额> != "0"
  actions:
    metadata:
      amount: <取出金额>
- id: 浦发收入
  when: <存入金额> != "" && <存入金额> != "0"
  actions:
    metadata:
      amount: <存入金额>.-
personalRules:
- id: 基金销售支出
  when: payee ~ "基金销售有限公司" && <取出金额> != "" && <取出金额> != "0"
  actions:
    to:
      account: Expenses:Investment:Funds
- id: 基金销售收入
  when: payee ~ "基金销售有限公司" && <存入金额> != "" && <存入金额> != "0"
  actions:
    from:
      account: Expenses:Investment:Funds
- id: 餐厅支出
  when: payee ~ "餐厅" && <取出金额> != "" && <取出金额> != "0"
  actions:
    to:
      account: Expenses:Food:Restaurant
- id: 餐厅收入
  when: payee ~ "餐厅" && <存入金额> != "" && <存入金额> != "0"
  actions:
    from:
      account: Expenses:Food:Restaurant
- id: 地铁支出
  when: payee ~ "地铁" && <取出金额> != "" && <取出金额> != "0"
  actions:
    to:
      account: Expenses:Transport:Metro
- id: 地铁收入
  when: payee ~ "地铁" && <存入金额> != "" && <存入金额> != "0"
  actions:
    from:
      account: Expenses:Transport:Metro
- id: 超市支出
  when: payee ~ "超市" && <取出金额> != "" && <取出金额> != "0"
  actions:
    to:
      account: Expenses:Shopping:Supermarket
- id: 超市收入
  when: payee ~ "超市" && <存入金额> != "" && <存入金额> != "0"
  actions:
    from:
      account: Expenses:Shopping:Supermarket
