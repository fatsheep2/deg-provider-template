schema: https://deg.dev/template-profile/v2
id: mt
name: Meituan
shape:
- locateHeader:
    anchor:
    - 交易创建时间
    - 订单标题
    - 实付金额
    scanRows: 60
template:
  fileFormat: csv
  delimiter: ','
  sourceHeaders:
  - 交易创建时间
  - 交易成功时间
  - 交易类型
  - 订单标题
  - 收/支
  - 支付方式
  - 订单金额
  - 实付金额
  - 交易单号
  - 商家单号
  - 备注
  defaultCurrency: CNY
  slots:
    date: <交易创建时间>
    narration: <订单标题>
    amount: <实付金额>.number
    currency: CNY
    metadata:
      merchantId: <商家单号>
      method: <支付方式>
      orderId: <交易单号>
      payTime: <交易创建时间> +0800 CST
      source: 美团
      type: <收/支>
  direction:
    column: <收/支>
    outflow:
    - 支出
    - 不计收支
    inflow:
    - 收入
    default: outflow
  timezone: Asia/Shanghai
