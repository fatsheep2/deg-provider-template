options:
  title: 测试
  operatingCurrency: CNY
template: huobi
# 角色绑定：self 是这份账单自己的账户，other 是对手方（支出时记在 to，收入/退款时记在 from）。没绑的一侧由引擎补 FIXME。
accounts:
  cash: Assets:Huobi:Cash
  position: Assets:Huobi:Positions
  fee: Expenses:Huobi:Commission
  pnl: Income:Huobi:PnL
# 输出设置（可选）：每笔交易的默认写法和要保留的元数据；个人规则仍可逐笔覆盖。
# output:
#   narration: <列名>
#   metadata:
#     drop: [某个键]
personalRules:
- id: Rule1 BTC 买入
  when: (narration ~ "BTC/USDT" || narration ~ "BTC1S/USDT") && narration ~ "买入" && payee ~ "币币交易"
  actions:
    accounts:
      cash: Assets:Rule1:Cash
      position: Assets:Rule1:Positions
      fee: Expenses:Rule1:Commission
      pnl: Income:Rule1:PnL
