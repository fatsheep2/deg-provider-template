schema: https://deg.dev/template-profile/v2
id: huobi
name: huobi
template:
  fileFormat: csv
  delimiter: ','
  sourceHeaders:
  - 时间
  - 交易类型
  - 交易对
  - 方向
  - 价格
  - 数量
  - 成交额
  - 手续费
  defaultCurrency: CNY
  slots:
    date: <时间>
    payee: Huobi-<交易类型>
    narration: <方向>-<交易对>
    amount: <成交额>.number
    currency: <交易对>.extract("/(.+)$")
  direction: {}
  vars:
    base: <交易对>.extract("/(.+)$")
    target: <交易对>.extract("^([^/]+)")
    fee: <手续费>.extract("^([.0-9]+)")
    feeUnit: <手续费>.extract("([A-Za-z][A-Za-z0-9]*)$")
  legs:
  - id: 买入手续费同币种
    when: <方向> == "买入" && <手续费>.extract("([A-Za-z][A-Za-z0-9]*)$") == <交易对>.extract("^([^/]+)")
    legs:
    - role: cash
      amount: '-<成交额>.format("%.8f")'
      currency: <var.base>
    - role: position
      amount: <数量>.format("%.8f")
      currency: <var.target>
      cost: <价格>.format("%.8f") <var.base>
      price: '@@ <成交额>.format("%.8f") <var.base>'
    - role: cash
      amount: '-<var.fee>.format("%.8f")'
      currency: <var.target>
      price: '@ <价格>.format("%.8f") <var.base>'
    - role: fee
      amount: <var.fee>.format("%.8f")
      currency: <var.feeUnit>
      price: '@ <价格>.format("%.8f") <var.base>'
  - id: 买入手续费异币种
    when: <方向> == "买入" && <手续费>.extract("([A-Za-z][A-Za-z0-9]*)$") != <交易对>.extract("^([^/]+)")
    legs:
    - role: cash
      amount: '-<成交额>.format("%.8f")'
      currency: <var.base>
    - role: position
      amount: <数量>.format("%.8f")
      currency: <var.target>
      cost: <价格>.format("%.4f") <var.base>
      price: '@@ <成交额>.format("%.8f") <var.base>'
    - role: position
      amount: '-<var.fee>.format("%.8f")'
      currency: <var.feeUnit>
    - role: fee
      amount: <var.fee>.format("%.8f")
      currency: <var.feeUnit>
  - id: 卖出
    when: <方向> == "卖出"
    legs:
    - role: position
      amount: '-<数量>.format("%.8f")'
      currency: <var.target>
      cost: '{}'
      price: '@ <价格>.format("%.8f") <var.base>'
    - role: cash
      amount: <成交额>.format("%.8f")
      currency: <var.base>
    - role: cash
      amount: '-<var.fee>.format("%.8f")'
      currency: <var.feeUnit>
    - role: fee
      amount: <var.fee>.format("%.8f")
      currency: <var.feeUnit>
    - role: pnl
  timezone: Asia/Shanghai
