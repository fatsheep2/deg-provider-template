schema: https://deg.dev/template-profile/v2
id: boc-debit
name: BOC Debit
shape:
- locateHeader:
    anchor:
    - 记账日期
    - 金额
    scanRows: 20
template:
  fileFormat: csv
  delimiter: ','
  sourceHeaders:
  - 记账日期
  - 记账时间
  - 币别
  - 金额
  - 余额
  - 交易名称
  - 渠道
  - 网点名称
  - 附言
  - 对方账户名
  - 对方卡号/账号
  - 对方开户行
  - 借记卡号
  defaultCurrency: CNY
  slots:
    date: <记账日期> <记账时间>
    payee: <对方账户名><对方卡号/账号>
    narration: <交易名称>
    amount: <金额>.number
    currency: CNY
  direction: {}
  timezone: Asia/Shanghai
