schema: https://deg.dev/template-profile/v2
id: ccb
name: ccb
template:
  fileFormat: xls
  delimiter: ','
  skipLeadingRows: 6
  skipInvalidRows: true
  sourceHeaders:
  - 记账日
  - 交易日期
  - 交易时间
  - 支出
  - 收入
  - 账户余额
  - 币种
  - 摘要
  - 对方账号
  - 对方户名
  - 交易地点
  defaultCurrency: CNY
  slots:
    date: <交易日期> <交易时间>
    payee: <对方户名>
    narration: <交易地点>
    currency: CNY
    metadata:
      accountNum: xxxxx*********xxxx
      balances: <账户余额>
      currency: <币种>
      expense: ''
      income: ''
      peerAccount: <对方户名>
      peerAccountNum: <对方账号>
      recordDate: <记账日>
      region: <交易地点>
      source: 中国建设银行
      tradeTime: <交易时间>
      txType: <摘要>
      type: ''
  direction:
    outflowColumn: <支出>
    inflowColumn: <收入>
