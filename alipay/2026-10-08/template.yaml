schema: https://deg.dev/template-profile/v2
id: alipay
name: 支付宝账单
shape:
- locateHeader:
    anchor:
    - 交易时间
    - 交易对方
    - 金额
    scanRows: 60
template:
  fileFormat: csv
  encoding: gb18030
  delimiter: ','
  sourceHeaders:
  - 交易时间
  - 交易分类
  - 交易对方
  - 对方账号
  - 商品说明
  - 收/支
  - 金额
  - 收/付款方式
  - 交易状态
  - 交易订单号
  - 商家订单号
  - 备注
  - ''
  defaultCurrency: CNY
  slots:
    date: <交易时间>
    payee: <交易对方>
    narration: <商品说明>
    amount: <金额>.number
    currency: CNY
    metadata:
      category: <交易分类>
      merchantId: <商家订单号>
      method: <收/付款方式>
      orderId: <交易订单号>
      payTime: <交易时间> +0800 CST
      source: 支付宝
      status: <交易状态>
      type: <收/支>
  direction:
    column: <收/支>
    outflow:
    - 支出
    inflow:
    - 收入
    default: outflow
