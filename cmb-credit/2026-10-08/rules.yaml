options:
  title: 测试
  operatingCurrency: CNY
template: cmb-credit
# 角色绑定：self 是这份账单自己的账户，other 是对手方（支出时记在 to，收入/退款时记在 from）。没绑的一侧由引擎补 FIXME。
accounts:
  self: Liabilities:CreditCard:CMB
# 输出设置（可选）：每笔交易的默认写法和要保留的元数据；个人规则仍可逐笔覆盖。
# output:
#   narration: <列名>
#   metadata:
#     drop: [某个键]
personalRules:
- id: 掌上生活影票
  when: narration ~ "掌上生活影票"
  actions:
    other: Expenses:Movie
- id: 手机银行饭票
  when: narration ~ "手机银行饭票"
  actions:
    other: Expenses:Food
- id: 中国移动
  when: narration ~ "中国移动"
  actions:
    other: Expenses:Mobile
- id: 忽略财付通
  when: narration ~ "财付通"
  actions:
    ignore: true
