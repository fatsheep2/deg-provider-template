schema: https://deg.dev/template-profile/v2
id: cmb-credit
name: CMB Credit
template:
  fileFormat: csv
  delimiter: ','
  skipLeadingRows: 1
  sourceHeaders:
  - 交易日
  - 记账日
  - 交易摘要
  - 人民币金额
  - 卡号末四位
  - 交易地金额
  defaultCurrency: CNY
  slots:
    date: 2024/<记账日>
    payee: CMB
    narration: <交易摘要>
    amount: <人民币金额>.number
    currency: CNY
  direction:
    invert: true
