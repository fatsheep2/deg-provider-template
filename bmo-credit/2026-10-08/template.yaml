schema: https://deg.dev/template-profile/v2
id: bmo-credit
name: BMO Credit
template:
  fileFormat: csv
  delimiter: ','
  skipLeadingRows: 1
  sourceHeaders:
  - 'Item #'
  - 'Card #'
  - Transaction Date
  - Posting Date
  - Transaction Amount
  - Description
  defaultCurrency: CAD
  slots:
    date: <Transaction Date>
    payee: BMO
    narration: <Description>
    amount: <Transaction Amount>.number
    currency: CAD
  direction:
    invert: true
  timezone: America/Toronto
