options:
  title: 测试
  operatingCurrency: CAD
template: bmo-credit
# 角色绑定：self 是这份账单自己的账户（支出时为 from，收入时为 to）；没绑的一侧由引擎补 FIXME。
accounts:
  self: Liabilities:CreditCard:BMO
personalRules:
- id: 大统华
  when: narration ~ "T T"
  actions:
    tags:
    - tt_tag
    to:
      account: Expenses:Grocery
- id: Costco
  when: narration ~ "COSTCO"
  actions:
    to:
      account: Expenses:Grocery
- id: T&T超市
  when: narration ~ "T&T SUPERMARKET"
  actions:
    to:
      account: Expenses:Grocery
- id: Jollibee
  when: narration ~ "JOLLIBEE"
  actions:
    to:
      account: Expenses:Food:Lunch
- id: Dollarama
  when: narration ~ "DOLLARAMA"
  actions:
    tags:
    - grocery_tag1
    - cheap_tag2
    to:
      account: Expenses:Grocery
- id: 工资
  when: narration ~ "DEVELOPM MSP" && <Transaction Amount> < 0
  actions:
    from:
      account: Income:Salary
