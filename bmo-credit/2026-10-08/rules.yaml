options:
  title: 测试
  operatingCurrency: CAD
template: bmo-credit
# 角色绑定：self 是这份账单自己的账户，other 是对手方（支出时记在 to，收入/退款时记在 from）。没绑的一侧由引擎补 FIXME。
accounts:
  self: Liabilities:CreditCard:BMO
# 输出设置（可选）：每笔交易的默认写法和要保留的元数据；个人规则仍可逐笔覆盖。
# output:
#   narration: <列名>
#   metadata:
#     drop: [某个键]
personalRules:
- id: 大统华
  when: narration ~ "T T"
  actions:
    tags:
    - tt_tag
    to:
      account: Expenses:Grocery
- id: Costco
  when: narration ~ "COSTCO"
  actions:
    to:
      account: Expenses:Grocery
- id: T&T超市
  when: narration ~ "T&T SUPERMARKET"
  actions:
    to:
      account: Expenses:Grocery
- id: Jollibee
  when: narration ~ "JOLLIBEE"
  actions:
    to:
      account: Expenses:Food:Lunch
- id: Dollarama
  when: narration ~ "DOLLARAMA"
  actions:
    tags:
    - grocery_tag1
    - cheap_tag2
    to:
      account: Expenses:Grocery
- id: 工资
  when: narration ~ "DEVELOPM MSP" && <Transaction Amount> < 0
  actions:
    from:
      account: Income:Salary
