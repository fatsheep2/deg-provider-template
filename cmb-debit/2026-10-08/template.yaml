schema: https://deg.dev/template-profile/v2
id: cmb-debit
name: CMB Debit
shape:
- locateHeader:
    anchor:
    - 记账日期
    - 交易金额
    scanRows: 30
- dropIf: <记账日期> == ""
template:
  fileFormat: csv
  delimiter: ','
  sourceHeaders:
  - 记账日期
  - 货币
  - 交易金额
  - 联机余额
  - 交易摘要
  - 对手信息
  - 客户摘要
  defaultCurrency: CNY
  slots:
    date: <记账日期>
    payee: <对手信息>
    narration: <客户摘要>
    amount: <交易金额>.number
    currency: <货币>
  direction: {}
  timezone: Asia/Shanghai
