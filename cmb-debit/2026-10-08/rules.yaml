options:
  title: 测试
  operatingCurrency: CNY
template: cmb-debit
# 角色绑定：self 是这份账单自己的账户（支出时为 from，收入时为 to）；没绑的一侧由引擎补 FIXME。
accounts:
  self: Assets:DebitCard:CMB
personalRules:
- id: 电费支出
  when: (payee ~ "电费" || payee ~ "网上国网" || payee ~ "国网") && <交易金额> < 0
  actions:
    to:
      account: Expenses:Electricity
- id: 电费收入
  when: (payee ~ "电费" || payee ~ "网上国网" || payee ~ "国网") && <交易金额> >= 0
  actions:
    from:
      account: Expenses:Electricity
- id: 中国移动支出
  when: payee ~ "中国移动" && <交易金额> < 0
  actions:
    to:
      account: Expenses:Mobile
- id: 中国移动收入
  when: payee ~ "中国移动" && <交易金额> >= 0
  actions:
    from:
      account: Expenses:Mobile
- id: 保险赔付收入
  when: payee ~ "太平洋健康保险股份有限公司" && narration ~ "汇入汇款" && <交易金额> >= 0
  actions:
    from:
      account: Income:Insurance
- id: 保险赔付支出
  when: payee ~ "太平洋健康保险股份有限公司" && narration ~ "汇入汇款" && <交易金额> < 0
  actions:
    to:
      account: Income:Insurance
