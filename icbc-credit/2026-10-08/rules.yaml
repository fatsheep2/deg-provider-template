options:
  title: 测试
  operatingCurrency: CNY
template: icbc-credit
# 角色绑定：self 是这份账单自己的账户（支出时为 from，收入时为 to）；没绑的一侧由引擎补 FIXME。
accounts:
  self: Liabilities:Bank:CN:ICBC
# 模板规则只整理字段（对手方、摘要、币种、元数据），不写账户。
templateRules:
- id: 工行信用卡收入
  when: <记账金额(收入)> != "" && <记账金额(收入)> != "-"
  actions:
    metadata:
      type: 收入
- id: 工行信用卡支出
  when: <记账金额(支出)> != "" && <记账金额(支出)> != "-"
  actions:
    metadata:
      type: 支出
personalRules:
- id: 忽略财付通支付宝
  when: payee ~ "财付通" || payee ~ "支付宝"
  actions:
    ignore: true
- id: 高速支出
  when: payee ~ "广东联合电子收费股份" && <记账金额(支出)> != "" && <记账金额(支出)> != "-"
  actions:
    to:
      account: Expenses:Transport:Highway
- id: 高速收入
  when: payee ~ "广东联合电子收费股份" && <记账金额(收入)> != "" && <记账金额(收入)> != "-"
  actions:
    from:
      account: Expenses:Transport:Highway
- id: 自动转账还款
  when: <摘要> ~ "人民币自动转帐还款"
  actions:
    from:
      account: Assets:Bank:CN:ICBC:Savings
