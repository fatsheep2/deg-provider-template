schema: https://deg.dev/template-profile/v2
id: td
name: TD Bank
template:
  fileFormat: csv
  delimiter: ','
  sourceHeaders:
  - date
  - narration
  - amountOut
  - amountIn
  - balance
  defaultCurrency: CAD
  slots:
    date: <date>
    payee: TD
    narration: <narration>
    currency: CAD
  direction:
    outflowColumn: <amountOut>
    inflowColumn: <amountIn>
