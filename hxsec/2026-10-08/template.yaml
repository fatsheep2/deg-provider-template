schema: https://deg.dev/template-profile/v2
id: hxsec
name: hxsec
shape:
- failIf: <txType> != "银行转证券" && <txType> != "证券转银行" && <txType> != "利息归本" && <txType> != "红利入账" && <txType> != "证券买入" && <txType> != "证券卖出" && <txType> != "融券回购" && <txType> != "融券购回" && <txType> != "ETF份额合并" && <txType> != "指定交易"
  message: 出现了模板不认识的业务名称，请在模板仓库报告
template:
  fileFormat: xls
  encoding: gb18030
  delimiter: "\t"
  skipLeadingRows: 1
  skipInvalidRows: true
  sourceHeaders:
  - date
  - time
  - txType
  - securityCode
  - securityName
  - price
  - quantity
  - remainingQuantity
  - tradeAmount
  - totalFee
  - amount
  - balance
  - commission
  - stampTax
  - transferFee
  - settlementFee
  - regulatoryFee
  - handlingFee
  - securitiesFee
  - financialLevy
  - otherFee
  - currency
  - tradeId
  - shareholderCode
  - accountNumber
  defaultCurrency: CNY
  slots:
    date: <date> <time>
    payee: hxsec
    metadata:
      account_number: <accountNumber>
      interest_rate: ''
      security_code: ''
      security_name: ''
      shareholder_code: ''
      trade_id: ''
      trade_time: <time>
    amount: <amount>.number
    narration: <txType>
  direction: {}
  vars:
  - vars:
      security: SZ<securityCode>.format("%06.0f")
      tradeAmount: <tradeAmount>.format("%.2f")
      totalFee: <totalFee>.format("%.2f")
      removedAmount: <quantity>.number + <remainingQuantity>.number
  - when: <shareholderCode> ~ "A"
    vars:
      security: SH<securityCode>.format("%06.0f")
  legs:
  - id: 银行转证券
    when: <txType> == "银行转证券"
    narration: 银行转证券
    legs:
    - role: cash
      amount: <amount>.format("%.2f")
      currency: CNY
    - role: custody
      amount: '-<amount>.format("%.2f")'
      currency: CNY
  - id: 证券转银行
    when: <txType> == "证券转银行"
    narration: 证券转银行
    legs:
    - role: custody
      amount: <amount>.+.format("%.2f")
      currency: CNY
    - role: cash
      amount: '-<amount>.+.format("%.2f")'
      currency: CNY
  - id: 利息归本
    when: <txType> == "利息归本"
    narration: 利息归本
    legs:
    - role: cash
      amount: <amount>.format("%.2f")
      currency: CNY
    - role: pnl
      amount: '-<amount>.format("%.2f")'
      currency: CNY
  - id: 红利入账
    when: <txType> == "红利入账"
    narration: 红利入账-<securityCode>.format("%06.0f")-<securityName>
    legs:
    - role: cash
      amount: <amount>.format("%.2f")
      currency: CNY
    - role: pnl
      amount: '-<amount>.format("%.2f")'
      currency: CNY
  - id: 证券买入
    when: <txType> == "证券买入"
    narration: 证券买入-<securityCode>.format("%06.0f")-<securityName>
    legs:
    - role: cash
      amount: '-<var.tradeAmount>'
      currency: CNY
    - role: position
      amount: <quantity>.format("%.2f")
      currency: <var.security>
      cost: <price>.format("%.3f") CNY
      price: '@@ <var.tradeAmount> CNY'
    - role: cash
      amount: '-<var.totalFee>'
      currency: CNY
    - role: fee
      amount: <var.totalFee>
      currency: CNY
  - id: 证券卖出
    when: <txType> == "证券卖出"
    narration: 证券卖出-<securityCode>.format("%06.0f")-<securityName>
    legs:
    - role: position
      amount: '-<quantity>.format("%.2f")'
      currency: <var.security>
      cost: '{}'
      price: '@ <price>.format("%.3f") CNY'
    - role: cash
      amount: <var.tradeAmount>
      currency: CNY
    - role: cash
      amount: '-<var.totalFee>'
      currency: CNY
    - role: fee
      amount: <var.totalFee>
      currency: CNY
    - role: pnl
  - id: 融券回购
    when: <txType> == "融券回购"
    narration: 融券回购-<securityCode>.format("%06.0f")-<securityName>
    legs:
    - role: cash
      amount: '-<var.tradeAmount>'
      currency: CNY
    - role: position
      amount: <quantity>.format("%.2f")
      currency: <var.security>
      cost: 100.000 CNY
      price: '@@ <var.tradeAmount> CNY'
    - role: cash
      amount: '-<var.totalFee>'
      currency: CNY
    - role: fee
      amount: <var.totalFee>
      currency: CNY
  - id: 融券购回
    when: <txType> == "融券购回"
    narration: 融券购回-<securityCode>.format("%06.0f")-<securityName>
    legs:
    - role: position
      amount: '-<quantity>.format("%.2f")'
      currency: <var.security>
      cost: '{}'
      price: '@ 100.000 CNY'
    - role: cash
      amount: <var.tradeAmount>
      currency: CNY
    - role: cash
      amount: '-<var.totalFee>'
      currency: CNY
    - role: fee
      amount: <var.totalFee>
      currency: CNY
    - role: pnl
  - id: ETF份额合并
    when: <txType> == "ETF份额合并"
    narration: ETF份额合并-<securityCode>.format("%06.0f")-<securityName>
    legs:
    - role: position
      amount: '-<var.removedAmount>'
      currency: <var.security>
      cost: '{}'
    - role: position
      amount: <remainingQuantity>.format("%.2f")
      currency: <var.security>
      cost: '{}'
  timezone: Asia/Shanghai
