options:
  title: 测试
  operatingCurrency: CNY
template: hxsec
# 角色绑定：self 是这份账单自己的账户，other 是对手方（支出时记在 to，收入/退款时记在 from）。没绑的一侧由引擎补 FIXME。
accounts:
  cash: Assets:Hxsec:Cash
  position: Assets:Hxsec:Positions
  fee: Expenses:Hxsec:Commission
  pnl: Income:Hxsec:PnL
  custody: Assets:CN:CCB:Debit
# 模板规则只整理字段（对手方、摘要、币种、元数据），不写账户。
templateRules:
- id: 华西证券元数据
  when: (<txType> == "证券买入" || <txType> == "融券回购" || <txType> == "证券卖出" || <txType> == "融券购回" || <txType> == "红利入账")
  actions:
    metadata:
      security_code: <securityCode>.format("%06.0f")
      security_name: <securityName>
      shareholder_code: <shareholderCode>
      trade_id: <tradeId>
- id: 上海证券代码
  when: <shareholderCode> ~ "A"
  actions:
    vars:
      security: SH<securityCode>.format("%06.0f")
- id: 银行转证券
  when: <txType> == "银行转证券"
  actions:
    narration: 银行转证券
- id: 证券转银行
  when: <txType> == "证券转银行"
  actions:
    narration: 证券转银行
- id: 利息归本
  when: <txType> == "利息归本"
  actions:
    narration: 利息归本
- id: 红利入账
  when: <txType> == "红利入账"
  actions:
    date: <date> 23:59:59
    narration: 红利入账-<securityCode>.format("%06.0f")-<securityName>
    metadata:
      trade_time: 86399
- id: 证券买入
  when: <txType> == "证券买入"
  actions:
    narration: 证券买入-<securityCode>.format("%06.0f")-<securityName>
- id: 证券卖出
  when: <txType> == "证券卖出"
  actions:
    narration: 证券卖出-<securityCode>.format("%06.0f")-<securityName>
- id: 融券回购
  when: <txType> == "融券回购"
  actions:
    narration: 融券回购-<securityCode>.format("%06.0f")-<securityName>
    metadata:
      interest_rate: <price>.format("%.3f")%
- id: 融券购回
  when: <txType> == "融券购回"
  actions:
    narration: 融券购回-<securityCode>.format("%06.0f")-<securityName>
    metadata:
      interest_rate: <price>.format("%.3f")%
- id: ETF份额合并
  when: <txType> == "ETF份额合并"
  actions:
    date: <date> 23:59:59
    narration: ETF份额合并-<securityCode>.format("%06.0f")-<securityName>
    vars:
      removedAmount: <quantity>.number + <remainingQuantity>.number
    metadata:
      shareholder_code: <shareholderCode>
      trade_time: 86399
- id: 忽略指定交易
  when: <txType> == "指定交易"
  actions:
    ignore: true
- id: 日终业务时间
  when: <txType> == "红利入账" || <txType> == "ETF份额合并"
  actions:
    date: <date> 23:59:59
    metadata:
      trade_time: '23:59:59'
- id: ETF份额合并股东
  when: <txType> == "ETF份额合并"
  actions:
    metadata:
      shareholder_code: <shareholderCode>
- id: 融券利率
  when: <txType> == "融券回购" || <txType> == "融券购回"
  actions:
    metadata:
      interest_rate: <price>.format("%.3f")%
# 输出设置（可选）：每笔交易的默认写法和要保留的元数据；个人规则仍可逐笔覆盖。
# output:
#   narration: <列名>
#   metadata:
#     drop: [某个键]
personalRules:
- id: Rule1 HS300ETF
  when: narration ~ "HS300ETF" || metadata.security_name ~ "HS300ETF"
  actions:
    accounts:
      cash: Assets:Rule1:Cash
      position: Assets:Hxsec:Positions:沪深300
      fee: Expenses:Rule1:Commission
      pnl: Income:Rule1:PnL
