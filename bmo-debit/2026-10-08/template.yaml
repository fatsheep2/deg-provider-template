schema: https://deg.dev/template-profile/v2
id: bmo-debit
name: BMO Debit
template:
  fileFormat: csv
  delimiter: ','
  skipLeadingRows: 1
  sourceHeaders:
  - First Bank Card
  - Transaction Type
  - Date Posted
  - Transaction Amount
  - Description
  defaultCurrency: CAD
  slots:
    date: <Date Posted>
    payee: BMO
    narration: <Description>
    currency: CAD
    amount: <Transaction Amount>.number
  direction:
    column: <Transaction Type>
    outflow:
    - DEBIT
    inflow:
    - CREDIT
    default: outflow
  timezone: America/Toronto
