options:
  title: 测试
  operatingCurrency: CAD
template: bmo-debit
# 角色绑定：self 是这份账单自己的账户（支出时为 from，收入时为 to）；没绑的一侧由引擎补 FIXME。
accounts:
  self: Assets:DebitCard:BMOChequing
personalRules:
- id: 大统华
  when: narration ~ "T T"
  actions:
    tags:
    - tt_tag
    to:
      account: Expenses:Grocery
- id: Dollarama
  when: narration ~ "DOLLARAMA"
  actions:
    tags:
    - grocery_tag1
    - cheap_tag2
    to:
      account: Expenses:Grocery
- id: 工资
  when: narration ~ "DEVELOPM MSP" && <Transaction Type> == CREDIT
  actions:
    from:
      account: Income:Salary
