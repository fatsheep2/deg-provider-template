options:
  title: bocom_credit
  operatingCurrency: CNY
template: bocom_credit
# 角色绑定：self 是这份账单自己的账户，other 是对手方（支出时记在 to，收入/退款时记在 from）。没绑的一侧由引擎补 FIXME。
accounts:
  self: Liabilities:BOCOM:CreditCard
# 模板规则只整理字段（对手方、摘要、币种、元数据），不写账户。
templateRules:
- id: 交通信用卡原始交易额
  when: <交易币种/金额> !~ "CNY"
  actions:
    metadata:
      transactionAmount: <交易币种/金额>
# 输出设置（可选）：每笔交易的默认写法和要保留的元数据；个人规则仍可逐笔覆盖。
# output:
#   narration: <列名>
#   metadata:
#     drop: [某个键]
personalRules:
- id: 信用卡还款
  when: narration ~ "信用卡还款"
  actions:
    from:
      account: Equity:Transfers
- id: 美团
  when: narration ~ "美团"
  actions:
    other: Expenses:Food
- id: 饿了么
  when: narration ~ "饿了么"
  actions:
    other: Expenses:Food
