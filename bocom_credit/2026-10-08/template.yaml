schema: https://deg.dev/template-profile/v2
id: bocom_credit
name: BOCOM Credit
template:
  fileFormat: csv
  delimiter: ','
  sourceHeaders:
  - 交易日期
  - 记账日期
  - 交易说明
  - 交易币种/金额
  - 入账币种/金额
  defaultCurrency: CNY
  slots:
    date: <交易日期>
    payee: BOCOM Credit
    narration: <交易说明>
    amount: <入账币种/金额>.number
    currency: <入账币种/金额>.extract("^[A-Z]+")
    metadata:
      recordDate: <记账日期>
      source: 交通银行信用卡
  direction:
    column: <交易说明>.extract("^[^ ]+")
    outflow:
    - 消费
    - 刷卡金扣回
    - 分期扣款
    - 自动购汇扣款
    inflow:
    - 退货
    - 信用卡还款
    - 红包还款
    - 刷卡金返还
    - 自动购汇还款
