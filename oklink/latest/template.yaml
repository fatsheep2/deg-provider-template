schema: https://deg.dev/template-profile/v2
id: oklink
template:
  fileFormat: csv
  delimiter: ','
  sourceHeaders:
  - 交易哈希
  - 区块高度
  - 本地时间(UTC+8)
  - UTC时间
  - 发送方
  - 发送方ENS
  - 接收方
  - 接收方ENS
  - 数量
  - 代币符号
  - 代币地址
  slots:
    date: <本地时间(UTC+8)>
    amount: <数量>.format("%.8f")
    currency: <代币符号>
    metadata:
      blockNo: <区块高度>
      contractAddress: <代币地址>
      direction: ''
      from: <发送方>
      to: <接收方>
      tokenName: <代币符号>
      tokenSymbol: <代币符号>
      txHash: <交易哈希>
  direction: {}
  timezone: Asia/Shanghai
  dateFormat: 2006/1/2 15:04:05
