schema: https://deg.dev/template-profile/v2
id: jd
name: JD
shape:
- locateHeader:
    anchor:
    - 交易时间
    - 商户名称
    - 金额
    scanRows: 60
template:
  fileFormat: csv
  delimiter: ','
  sourceHeaders:
  - 交易时间
  - 商户名称
  - 交易说明
  - 金额
  - 收/付款方式
  - 交易状态
  - 收/支
  - 交易分类
  - 交易订单号
  - 商家订单号
  - 备注
  defaultCurrency: CNY
  slots:
    date: <交易时间>
    payee: <商户名称>
    narration: <交易说明>
    amount: <金额>.extract("^([.0-9]+)").number
    currency: CNY
    metadata:
      category: <交易分类>
      merchantId: <商家订单号>
      method: <收/付款方式>
      orderId: <交易订单号>
      payTime: <交易时间> +0800 CST
      source: <商户名称>
      status: <交易状态>
      type: <收/支>
  direction:
    column: <收/支>
    outflow:
    - 支出
    - 不计收支
    inflow:
    - 收入
  timezone: Asia/Shanghai
