schema: https://deg.dev/template-profile/v2
id: hsbchk-debit
name: HSBC HK Debit
template:
  fileFormat: csv
  delimiter: ','
  stripTabs: true
  dateFormat: 02/01/2006
  sourceHeaders:
  - Date
  - Description
  - Billing amount
  - Billing currency
  - Balance
  - Balance currency
  defaultCurrency: HKD
  slots:
    date: <Date>
    payee: <Description>
    amount: <Billing amount>.number
    currency: <Billing currency>
    metadata:
      balance: <Balance>.number <Balance currency>
      source: HSBC HK
  direction: {}
  timezone: Asia/Hong_Kong
