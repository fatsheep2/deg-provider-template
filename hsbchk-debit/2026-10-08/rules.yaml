options:
  title: HSBC HK借记卡示例
  operatingCurrency: HKD
template: hsbchk-debit
# 角色绑定：self 是这份账单自己的账户（支出时为 from，收入时为 to）；没绑的一侧由引擎补 FIXME。
accounts:
  self: Assets:Bank:HK:HSBC:Savings
personalRules:
- id: 取现收入
  when: payee ~ "WITHDRAWAL" && <Billing amount> >= 0
  actions:
    from:
      account: Assets:Cash
- id: 取现支出
  when: payee ~ "WITHDRAWAL" && <Billing amount> < 0
  actions:
    to:
      account: Assets:Cash
- id: 工资收入
  when: payee ~ "SALARY PAYMENT" && <Billing amount> >= 0
  actions:
    from:
      account: Income:Salary
- id: 工资支出
  when: payee ~ "SALARY PAYMENT" && <Billing amount> < 0
  actions:
    to:
      account: Income:Salary
- id: 转入收入
  when: payee ~ "TRANSFER FROM" && <Billing amount> >= 0
  actions:
    from:
      account: Income:Transfer
- id: 转入支出
  when: payee ~ "TRANSFER FROM" && <Billing amount> < 0
  actions:
    to:
      account: Income:Transfer
- id: 账单缴费收入
  when: payee ~ "BILL PAYMENT" && <Billing amount> >= 0
  actions:
    from:
      account: Expenses:Utilities
- id: 账单缴费支出
  when: payee ~ "BILL PAYMENT" && <Billing amount> < 0
  actions:
    to:
      account: Expenses:Utilities
- id: 超市收入
  when: (payee ~ "POS PURCHASE" || payee ~ "SUPERMARKET") && <Billing amount> >= 0
  actions:
    from:
      account: Expenses:Groceries
- id: 超市支出
  when: (payee ~ "POS PURCHASE" || payee ~ "SUPERMARKET") && <Billing amount> < 0
  actions:
    to:
      account: Expenses:Groceries
- id: 利息收入
  when: payee ~ "INTEREST CREDIT" && <Billing amount> >= 0
  actions:
    from:
      account: Income:Interest
- id: 利息支出
  when: payee ~ "INTEREST CREDIT" && <Billing amount> < 0
  actions:
    to:
      account: Income:Interest
- id: 忽略TRIPLEZ
  when: payee ~ "TRIPLE Z"
  actions:
    ignore: true
