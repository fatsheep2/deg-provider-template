options:
  title: HSBC HK借记卡示例
  operatingCurrency: HKD
template: hsbchk-debit
# 角色绑定：self 是这份账单自己的账户，other 是对手方（支出时记在 to，收入/退款时记在 from）。没绑的一侧由引擎补 FIXME。
accounts:
  self: Assets:Bank:HK:HSBC:Savings
# 输出设置（可选）：每笔交易的默认写法和要保留的元数据；个人规则仍可逐笔覆盖。
# output:
#   narration: <列名>
#   metadata:
#     drop: [某个键]
personalRules:
- id: 取现
  when: payee ~ "WITHDRAWAL"
  actions:
    other: Assets:Cash
- id: 工资
  when: payee ~ "SALARY PAYMENT"
  actions:
    other: Income:Salary
- id: 转入
  when: payee ~ "TRANSFER FROM"
  actions:
    other: Income:Transfer
- id: 账单缴费
  when: payee ~ "BILL PAYMENT"
  actions:
    other: Expenses:Utilities
- id: 超市
  when: (payee ~ "POS PURCHASE" || payee ~ "SUPERMARKET")
  actions:
    other: Expenses:Groceries
- id: 利息
  when: payee ~ "INTEREST CREDIT"
  actions:
    other: Income:Interest
- id: 忽略TRIPLEZ
  when: payee ~ "TRIPLE Z"
  actions:
    ignore: true
