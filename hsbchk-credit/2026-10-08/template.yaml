schema: https://deg.dev/template-profile/v2
id: hsbchk-credit
name: HSBC HK Credit
template:
  fileFormat: csv
  delimiter: ','
  stripTabs: true
  dateFormat: 02/01/2006
  sourceHeaders:
  - Transaction date
  - Post date
  - Description
  - Billing amount
  - Billing currency
  - Transaction status
  - Merchant name
  - Country / region
  - Area / district
  - Credit / Debit
  defaultCurrency: CNY
  slots:
    date: <Transaction date>
    payee: <Merchant name>
    narration: <Description>
    amount: <Billing amount>.number
    currency: <Billing currency>
    metadata:
      country: <Country / region>
      credit_or_debit: <Credit / Debit>
      post_date: <Post date>
      source: HSBC HK
      status: <Transaction status>
  direction:
    column: <Credit / Debit>
    outflow:
    - DEBIT
    inflow:
    - CREDIT
  timezone: Asia/Hong_Kong
