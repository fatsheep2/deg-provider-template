options:
  title: HSBC HK信用卡示例
  operatingCurrency: CNY
template: hsbchk-credit
# 角色绑定：self 是这份账单自己的账户（支出时为 from，收入时为 to）；没绑的一侧由引擎补 FIXME。
accounts:
  self: Liabilities:CreditCard:HSBC
personalRules:
- id: 美团支出
  when: payee ~ "MEITUAN" && narration ~ "APPLEPAY MEITUAN" && <Credit / Debit> == DEBIT
  actions:
    to:
      account: Expenses:Food:Delivery
- id: 美团收入
  when: payee ~ "MEITUAN" && narration ~ "APPLEPAY MEITUAN" && <Credit / Debit> == CREDIT
  actions:
    from:
      account: Expenses:Food:Delivery
- id: 还款
  when: narration ~ "PAYMENT - THANK YOU"
  actions:
    from:
      account: Assets:Bank:HK:HSBC:Savings
- id: 快餐支出
  when: (payee ~ "KFC RESTAURANT" || payee ~ "MCDONALDS") && <Credit / Debit> == DEBIT
  actions:
    to:
      account: Expenses:Food:FastFood
- id: 快餐收入
  when: (payee ~ "KFC RESTAURANT" || payee ~ "MCDONALDS") && <Credit / Debit> == CREDIT
  actions:
    from:
      account: Expenses:Food:FastFood
- id: 便利店支出
  when: payee ~ "7-ELEVEN" && <Credit / Debit> == DEBIT
  actions:
    to:
      account: Expenses:Groceries
- id: 便利店收入
  when: payee ~ "7-ELEVEN" && <Credit / Debit> == CREDIT
  actions:
    from:
      account: Expenses:Groceries
- id: 地铁支出
  when: payee ~ "METRO" && <Credit / Debit> == DEBIT
  actions:
    to:
      account: Expenses:Transport
- id: 地铁收入
  when: payee ~ "METRO" && <Credit / Debit> == CREDIT
  actions:
    from:
      account: Expenses:Transport
- id: 退款
  when: narration ~ "RETURN"
  actions:
    from:
      account: Assets:Refund
- id: 银联商户支出
  when: payee ~ "UNIONPAY MERCHANT" && <Credit / Debit> == DEBIT
  actions:
    to:
      account: Expenses:Shopping
- id: 银联商户收入
  when: payee ~ "UNIONPAY MERCHANT" && <Credit / Debit> == CREDIT
  actions:
    from:
      account: Expenses:Shopping
