options:
  title: HSBC HK信用卡示例
  operatingCurrency: CNY
template: hsbchk-credit
# 角色绑定：self 是这份账单自己的账户，other 是对手方（支出时记在 to，收入/退款时记在 from）。没绑的一侧由引擎补 FIXME。
accounts:
  self: Liabilities:CreditCard:HSBC
# 输出设置（可选）：每笔交易的默认写法和要保留的元数据；个人规则仍可逐笔覆盖。
# output:
#   narration: <列名>
#   metadata:
#     drop: [某个键]
personalRules:
- id: 美团
  when: payee ~ "MEITUAN" && narration ~ "APPLEPAY MEITUAN"
  actions:
    other: Expenses:Food:Delivery
- id: 还款
  when: narration ~ "PAYMENT - THANK YOU"
  actions:
    from:
      account: Assets:Bank:HK:HSBC:Savings
- id: 快餐
  when: (payee ~ "KFC RESTAURANT" || payee ~ "MCDONALDS")
  actions:
    other: Expenses:Food:FastFood
- id: 便利店
  when: payee ~ "7-ELEVEN"
  actions:
    other: Expenses:Groceries
- id: 地铁
  when: payee ~ "METRO"
  actions:
    other: Expenses:Transport
- id: 退款
  when: narration ~ "RETURN"
  actions:
    from:
      account: Assets:Refund
- id: 银联商户
  when: payee ~ "UNIONPAY MERCHANT"
  actions:
    other: Expenses:Shopping
