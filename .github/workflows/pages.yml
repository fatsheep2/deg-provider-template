name: Deploy Provider Hub

on:
  push:
    branches:
      - dev-v3
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # The in-browser converter is the Go importer compiled to WebAssembly.
      - name: Build runtime wasm
        env:
          DEG_REPO: ${{ vars.DEG_REPO || 'fatsheep2/double-entry-generator' }}
          DEG_REF: ${{ vars.DEG_REF || 'dev-v3' }}
        run: |
          git clone --depth 1 --branch "$DEG_REF" "https://github.com/$DEG_REPO" /tmp/deg
          (cd /tmp/deg && GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o "$GITHUB_WORKSPACE/site/public/deg-runtime.wasm" ./cmd/wasm-runtime)
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" site/public/wasm_exec.js

      - name: Test site
        working-directory: site
        run: npm test

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
