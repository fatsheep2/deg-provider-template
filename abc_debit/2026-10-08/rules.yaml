options:
  title: abc_debit
  operatingCurrency: CNY
template: abc_debit
# 角色绑定：self 是这份账单自己的账户（支出时为 from，收入时为 to）；没绑的一侧由引擎补 FIXME。
accounts:
  self: Assets:ABC:DebitCard
# 模板规则只整理字段（对手方、摘要、币种、元数据），不写账户。
templateRules:
- id: 农行借记卡默认对手方
  when: <对手信息> == "" || <对手信息> == "--"
  actions:
    payee: ABC Debit
- id: 农行借记卡附言摘要
  when: <交易附言> != ""
  actions:
    narration: <交易摘要> - <交易附言>
personalRules:
- id: 转存收入
  when: narration ~ "转存" && <交易金额> >= 0
  actions:
    from:
      account: Equity:Transfers
- id: 转存支出
  when: narration ~ "转存" && <交易金额> < 0
  actions:
    to:
      account: Equity:Transfers
- id: 财付通收入
  when: narration ~ "财付通" && <交易金额> >= 0
  actions:
    from:
      account: Expenses:Transport:Transit
- id: 财付通支出
  when: narration ~ "财付通" && <交易金额> < 0
  actions:
    to:
      account: Expenses:Transport:Transit
- id: 正常还款收入
  when: narration ~ "正常还款" && <交易金额> >= 0
  actions:
    from:
      account: Liabilities:Loans:Personal
- id: 正常还款支出
  when: narration ~ "正常还款" && <交易金额> < 0
  actions:
    to:
      account: Liabilities:Loans:Personal
- id: 结息收入
  when: narration ~ "结息" && <交易金额> >= 0
  actions:
    from:
      account: Income:Interest
- id: 结息支出
  when: narration ~ "结息" && <交易金额> < 0
  actions:
    to:
      account: Income:Interest
- id: 利息税收入
  when: narration ~ "利息税" && <交易金额> >= 0
  actions:
    from:
      account: Expenses:Tax
- id: 利息税支出
  when: narration ~ "利息税" && <交易金额> < 0
  actions:
    to:
      account: Expenses:Tax
