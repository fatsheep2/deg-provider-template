schema: https://deg.dev/template-profile/v2
id: abc_debit
name: ABC Debit
template:
  fileFormat: csv
  delimiter: ','
  sourceHeaders:
  - 交易日期
  - 交易时间
  - 交易摘要
  - 交易金额
  - 本次余额
  - 对手信息
  - 日 志 号
  - 交易渠道
  - 交易附言
  defaultCurrency: CNY
  slots:
    date: <交易日期> <交易时间>
    payee: <对手信息>
    narration: <交易摘要>
    amount: <交易金额>.number
    currency: CNY
    metadata:
      amount: <交易金额>
      balance: <本次余额>
      channel: <交易渠道>
      logNumber: <日 志 号>
      postscript: <交易附言>
      source: 中国农业银行储蓄卡
  direction: {}
