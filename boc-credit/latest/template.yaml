schema: https://deg.dev/template-profile/v2
id: boc-credit
name: BOC Credit
shape:
- locateHeader:
    anchor:
    - 交易日
    - 存入
    - 支出
    scanRows: 20
template:
  fileFormat: csv
  delimiter: ','
  sourceHeaders:
  - 交易日
  - 银行记账日
  - 卡号后四位
  - 交易描述
  - 存入
  - 支出
  - 币种
  defaultCurrency: CNY
  slots:
    date: <银行记账日> 20:00:00
    payee: ''
    narration: <交易描述>
    currency: <币种>
  direction:
    outflowColumn: <支出>
    inflowColumn: <存入>
  timezone: Asia/Shanghai
