options:
  title: boc
  operatingCurrency: CNY
template: boc-credit
# 角色绑定：self 是这份账单自己的账户，other 是对手方（支出时记在 to，收入/退款时记在 from）。没绑的一侧由引擎补 FIXME。
accounts: {}
# 输出设置（可选）：每笔交易的默认写法和要保留的元数据；个人规则仍可逐笔覆盖。
# output:
#   narration: <列名>
#   metadata:
#     drop: [某个键]
personalRules:
- id: 公共交通
  when: narration ~ "公共交通"
  actions:
    other: Expenses:Transport:Subway
- id: 游戏
  when: (narration ~ "xbox" || narration ~ "steam" || narration ~ "游戏")
  actions:
    other: Expenses:Relax:Game
- id: 培训
  when: narration ~ "顾问有限公司"
  actions:
    other: Expenses:Education:Training
- id: 房租
  when: narration ~ "张林"
  actions:
    other: Expenses:Reside:Rent
- id: BCM0258
  when: narration ~ "0258"
  actions:
    other: Assets:DC:BCM:0258
- id: CMBC5669
  when: narration ~ "5669"
  actions:
    other: Liabilities:CC:CMBC:5669
- id: BCM4664
  when: narration ~ "4664"
  actions:
    other: Liabilities:CC:BCM:4664
- id: CMB4294
  when: narration ~ "4294"
  actions:
    other: Liabilities:CC:CMB:4294
- id: 忽略支付平台描述
  when: narration ~ "支付宝" || narration ~ "微信" || narration ~ "钱袋宝" || narration ~ "京东"
  actions:
    ignore: true
- id: 忽略曾三
  when: narration ~ "曾三"
  actions:
    ignore: true
- id: 方法3167
  when: <卡号后四位> ~ "3167"
  actions:
    accounts:
      self: Assets:DC:BoC:3167
- id: 方法2875
  when: <卡号后四位> ~ "2875"
  actions:
    accounts:
      self: Liabilities:CC:BoC:2875
- id: 方法4260
  when: <卡号后四位> ~ "4260"
  actions:
    accounts:
      self: Liabilities:CC:BoC:4260
- id: 网银在线返利
  when: narration ~ "网银在线CHN" && <存入> != ""
  actions:
    from:
      account: Income:BoC:Rebate
- id: 工资收入
  when: narration ~ "工资" && <存入> != ""
  actions:
    from:
      account: Income:BoC:Salary
