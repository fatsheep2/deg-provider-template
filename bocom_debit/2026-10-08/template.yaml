schema: https://deg.dev/template-profile/v2
id: bocom_debit
name: BOCOM Debit
template:
  fileFormat: csv
  delimiter: ','
  sourceHeaders:
  - 序号
  - 交易日期
  - 交易时间
  - 交易类型
  - 借贷
  - 交易金额
  - 余额
  - 对方账号
  - 对方户名
  - 交易地点
  - 摘要
  defaultCurrency: CNY
  slots:
    date: <交易日期> <交易时间>
    payee: <对方户名> <对方账号>
    narration: <交易地点>
    amount: <交易金额>.number
    currency: CNY
    metadata:
      abstract: ''
      balance: <余额>
      currency: CNY
      dcFlg: <借贷>
      payTime: <交易日期> <交易时间> +0800 CST
      paymentReceiptAccount: <对方账号>
      paymentReceiptAccountName: <对方户名>
      serialNum: <序号>
      source: 交通银行
      tradingPlace: <交易地点>
      tradingType: <交易类型>
      transDate: <交易日期>
      transTime: <交易时间>
  direction:
    column: <借贷>.extract("^(.)")
    outflow:
    - 借
    inflow:
    - 贷
