options:
  title: 交通银行借记卡示例
  operatingCurrency: CNY
template: bocom_debit
# 角色绑定：self 是这份账单自己的账户（支出时为 from，收入时为 to）；没绑的一侧由引擎补 FIXME。
accounts:
  self: Assets:DebitCard:BOCOM
# 模板规则只整理字段（对手方、摘要、币种、元数据），不写账户。
templateRules:
- id: 交通借记卡摘要
  when: <摘要> != ""
  actions:
    narration: <交易地点> <摘要>
    metadata:
      abstract: <摘要>
personalRules:
- id: 存款利息收入
  when: payee ~ "应付个人活期储蓄存款利息" && <借贷> ~ "贷"
  actions:
    from:
      account: Income:Interest
- id: 存款利息支出
  when: payee ~ "应付个人活期储蓄存款利息" && <借贷> ~ "借"
  actions:
    to:
      account: Income:Interest
- id: 信用卡还款收入
  when: payee ~ "信用卡还款" && <借贷> ~ "贷"
  actions:
    from:
      account: Equity:Transfers
- id: 信用卡还款支出
  when: payee ~ "信用卡还款" && <借贷> ~ "借"
  actions:
    to:
      account: Equity:Transfers
- id: 信用卡转账还款收入
  when: <交易类型> ~ "信用卡转账还款" && <借贷> ~ "贷"
  actions:
    from:
      account: Equity:Transfers
- id: 信用卡转账还款支出
  when: <交易类型> ~ "信用卡转账还款" && <借贷> ~ "借"
  actions:
    to:
      account: Equity:Transfers
- id: 网上国网收入
  when: payee ~ "网上国网" && <借贷> ~ "贷"
  actions:
    from:
      account: Expenses:Electricity
- id: 网上国网支出
  when: payee ~ "网上国网" && <借贷> ~ "借"
  actions:
    to:
      account: Expenses:Electricity
- id: 基金申购收入
  when: <摘要> ~ "基金理财产品申购" && <借贷> ~ "贷"
  actions:
    from:
      account: Assets:Funds
- id: 基金申购支出
  when: <摘要> ~ "基金理财产品申购" && <借贷> ~ "借"
  actions:
    to:
      account: Assets:Funds
- id: 忽略财付通
  when: <摘要> ~ "财付通"
  actions:
    ignore: true
