options:
  title: 测试
  operatingCurrency: CNY
template: icbc-debit-v2
# 角色绑定：self 是这份账单自己的账户（支出时为 from，收入时为 to）；没绑的一侧由引擎补 FIXME。
accounts:
  self: Assets:Bank:CN:ICBC
# 模板规则只整理字段（对手方、摘要、币种、元数据），不写账户。
templateRules:
- id: 工行借记卡V2对手方
  when: <交易场所> == ""
  actions:
    payee: <对方户名>
- id: 工行借记卡V2组合对手方
  when: <交易场所> != "" && <对方户名> != ""
  actions:
    payee: <交易场所> <对方户名>
- id: 工行借记卡V2收入
  when: <记账金额(收入)> != "" && <记账金额(收入)> != "-"
  actions:
    metadata:
      type: 收入
- id: 工行借记卡V2支出
  when: <记账金额(支出)> != "" && <记账金额(支出)> != "-"
  actions:
    metadata:
      type: 支出
personalRules:
- id: 忽略财付通支付宝
  when: payee ~ "财付通-" || payee ~ "支付宝-"
  actions:
    ignore: true
- id: 忽略蚂蚁基金赎回
  when: payee ~ "支付宝" && <摘要> ~ "蚂蚁基金赎回到银行"
  actions:
    ignore: true
- id: 信用卡合伙人收入
  when: <对方户名> ~ "总行信用卡合伙人" && <记账金额(收入)> != "" && <记账金额(收入)> != "-"
  actions:
    from:
      account: Income:Bank:ICBC:CreditCard
- id: 掌上生活还款支出
  when: <对方户名> ~ "掌上生活还款" && <记账金额(支出)> != "" && <记账金额(支出)> != "-"
  actions:
    to:
      account: Liabilities:Bank:CMB:CreditCard
- id: 忽略自动还款
  when: payee ~ "广东XX分行银行卡中心" && <摘要> ~ "自动还款"
  actions:
    ignore: true
- id: 借款人收入
  when: (<对方户名> ~ "张三" || <对方户名> ~ "李四" || <对方户名> ~ "王五") && <记账金额(收入)> != "" && <记账金额(收入)> != "-"
  actions:
    from:
      account: Assets:Borrow
- id: 借款人支出
  when: (<对方户名> ~ "张三" || <对方户名> ~ "李四" || <对方户名> ~ "王五") && <记账金额(支出)> != "" && <记账金额(支出)> != "-"
  actions:
    to:
      account: Assets:Borrow
